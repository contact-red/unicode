name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, test, conform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ponyup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/ponylang/ponyup/main/ponyup-init.sh \
            | sh -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/share/ponyup/bin" >> "$GITHUB_PATH"

      - name: Install ponyc and corral
        run: |
          ponyup default nightly
          ponyup update ponyc release
          ponyup update corral release

      - name: Show toolchain versions
        run: |
          ponyc --version
          corral version

      - name: Cache corral dependencies
        uses: actions/cache@v4
        with:
          path: _corral
          key: corral-${{ runner.os }}-${{ hashFiles('corral.json') }}

      - name: Build and run unit tests
        run: make test

      - name: Verify unicode-build codegen still compiles
        run: make ucd-build

      - name: Cache UCD source files
        id: ucd-cache
        uses: actions/cache@v4
        with:
          path: ucd
          # Bumping this key (or modifying Makefile UCD_URL) forces a re-download
          key: ucd-${{ hashFiles('Makefile') }}-v1

      - name: Download UCD source files
        if: steps.ucd-cache.outputs.cache-hit != 'true'
        run: make ucd-download

      - name: Run UAX #15 NormalizationTest.txt conformance
        run: make conform
