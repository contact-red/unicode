name: PR

on: pull_request

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  superlinter:
    name: Lint bash, docker, markdown, and yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Lint codebase
        uses: docker://github/super-linter:v3.8.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_MD: true
          VALIDATE_YAML: true

  verify-changelog:
    name: Verify CHANGELOG is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Verify CHANGELOG
        uses: docker://ghcr.io/ponylang/changelog-tool:release
        with:
          args: changelog-tool verify

  test-static:
    name: Run tests + UAX #15 conformance
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/redvers/pony-dependency-builder:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache UCD source files
        id: ucd-cache
        uses: actions/cache@v4
        with:
          path: ucd
          # Bump the suffix to force a re-download.
          key: ucd-${{ hashFiles('Makefile') }}-v1

      - name: Download UCD source files
        if: steps.ucd-cache.outputs.cache-hit != 'true'
        run: make ucd-download

      - name: Build and test
        run: make ci
